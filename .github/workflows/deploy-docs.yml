name: Deploy Docs 📚

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # --ignore-scripts so sibling packages' postinstall hooks don't run in CI:
      # playground/nuxt runs `nuxt prepare`, which needs @colorffy/ui's dist built
      # (not present in a fresh checkout, and not needed for the docs — they only
      # extend the published `docus`). We then rebuild just better-sqlite3, the
      # native dep Nuxt Content needs at generate time.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # -r (recursive) is required: better-sqlite3 is a dependency of the `docs`
      # workspace package, not the root — a non-recursive rebuild silently no-ops.
      - name: Build better-sqlite3 (native, for Nuxt Content)
        run: pnpm rebuild -r better-sqlite3

      - name: Generate static site
        run: pnpm --filter colorffy-docs generate
        env:
          # Used for absolute URLs in sitemap.xml, llms.txt and OG images.
          # Override by setting a `DOCS_SITE_URL` repository variable (e.g. your custom domain).
          NUXT_PUBLIC_SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://colorffy-docs.pages.dev' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy docs/.output/public --project-name=colorffy-ui-docs --branch=main
