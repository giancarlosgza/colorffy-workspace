name: Deploy Docs 📚

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # -r (recursive) is required
      - name: Build better-sqlite3 (native, for Nuxt Content)
        run: pnpm rebuild -r better-sqlite3

      - name: Generate static site
        run: pnpm --filter colorffy-docs generate
        env:
          NUXT_PUBLIC_SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://colorffy-docs.pages.dev' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.110.0'
          command: pages deploy docs/.output/public --project-name=colorffy-ui-docs --branch=main
